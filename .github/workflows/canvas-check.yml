name: Check Canvas definitions against the site

on:
  pull_request:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r canvas/requirements.txt

      - name: Check Canvas definitions
        run: python canvas/tools/check_sync.py --list
