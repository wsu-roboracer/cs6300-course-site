# Course-level Canvas settings for CS 6300.
# Everything under canvas/ describes what lives in Canvas; the lab and tutorial
# content itself stays in docs/ and is published to the course site.

term: Spring 2027
time_zone: America/Denver     # due dates in canvas/assignments/ are in this zone

# The semester, which is the one thing that changes every time the course runs.
# check_sync.py fails if any due or lock date falls outside the term or inside the
# break, which is what stops a date from quietly landing in a week with no classes.
calendar:
  starts: 2027-01-11          # Monday of week 1
  ends: 2027-04-26
  break:
    starts: 2027-03-08
    ends: 2027-03-12
  # Lab parts are due on Sundays, lectures are Wednesdays and car days are Mondays.
  due_weekday: sunday

canvas:
  # .env overrides base_url and course_id (CANVAS_API_URL, CANVAS_COURSE_ID),
  # so these are only the defaults.
  base_url: http://192.168.4.100:3000
  course_id: null
  # false: new items are created unpublished and nothing is published for you.
  # true: every pushed page, assignment, and module is published.
  publish: false
  # Canvas group set that team labs are assigned to. Created empty if missing.
  team_group_set: Lab Teams
  # Canvas applies this to the whole course; it cannot be set per assignment. Sim parts
  # absorb it, which is the point: a student who has not written their node before the
  # car day has nothing to port and holds up their team. Car parts are due at the end of
  # the slack window they already had, so Canvas never marks one late.
  late_policy:
    percent_per_day: 10
    # No lowest-possible-grade floor. At 10% a day the deduction reaches zero on day 10,
    # and every lock date is due + 14 days, so the assignment closes after that.
    lowest_possible_grade: null

site:
  base_url: https://wsu-roboracer.github.io/cs6300-course-site
  docs_dir: docs
  # Every site page matching these globs (relative to docs_dir) must have a
  # Canvas assignment in canvas/assignments/. check_sync.py fails otherwise.
  assignment_pages:
    - weber_assignments/labs/lab*.rst
  # Every tutorial area must have a Canvas page in canvas/pages/.
  area_pages:
    - tutorials/Module*/*/index.rst
  ignore_pages:
    - weber_assignments/labs/index.rst

# The GitHub repo creator students use to get their own copy of a lab repo.
# The course key and each assignment's repo_task must be registered in the
# faculty course-data repo before the links work.
repo_creator:
  base_url: https://hadzikcs.netlify.app/gh
  course: sh/CS6300
  # The course passcode is NOT here on purpose: this repository is public. It is read
  # from $REPO_CREATOR_PASSCODE in .env (gitignored) and written into the Canvas
  # assignment pages at push time, so students read it in Canvas, behind a login.
  # Source of truth is the creator's own config, courses.CS6300.passcode in
  # github_student_repo_setup/instructors/scotthadzik.json. If it changes there,
  # change it in .env. See canvas/README.md.

# Where the student-facing lab repos live. Each lab folder in this repo
# (an assignment's repo_folder) is pushed to <org>/<repo_task> by
# sync_lab_repo.py. That repo is the template the repo creator copies.
lab_repos:
  org: Weber-AGV
  # Solutions are kept outside this repo because this repo is public.
  # <solutions_dir>/<repo_task>/ holds the solved copy of each file that differs
  # from the starter; sync_lab_repo.py --solutions lays it over main to build
  # the lab repo's solutions branch. The path is relative to the repo root.
  solutions_dir: ../../solutions

# Canvas assignment groups. Labs are the whole grade, so the weight is 100 and the
# breakdown is the points themselves: every lab part is worth 100, except Computer
# Vision, which is one 200-point part because it is a full lab's work with no simulator
# part to split off. Lab 1 is the only 100-point lab - week one is also everyone's
# ROS 2 install week. That totals 1700 points across nine labs.
assignment_groups:
  - name: Labs
    weight: 100
